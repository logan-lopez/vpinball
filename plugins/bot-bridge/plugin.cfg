[configuration]
id = "BotBridge"
name = "Bot Bridge"
description = "Telemetry out / commands in for an external bot (AI pinball league)"
author = "VPX Bot Bridge"
version = "0.1"
link = "https://github.com/vpinball/vpinball"

[libraries]
windows.x86 = "plugin-bot-bridge.dll"
windows.x64 = "plugin-bot-bridge64.dll"
linux.x64 = "plugin-bot-bridge.so"
linux.aarch64 = "plugin-bot-bridge.so"
macos.x64 = "plugin-bot-bridge.dylib"
macos.arm64 = "plugin-bot-bridge.dylib"
